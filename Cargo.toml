[package]
name = "four2four2"
version = "0.1.0"
edition = "2024"
default-run = "four2four2"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
itertools = "0.15.0"
rand = "0.10.4"
rayon = "1.12.0"

[features]
# used for eg not inlining functions so they show up when profiling.
# #[cfg_attr(feature = "profiling", inline(never))]
profiling = []

[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "packed"
